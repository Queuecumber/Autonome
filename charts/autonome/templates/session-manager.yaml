{{- $svc := .Values.services.sessionManager }}
{{- $name := "session-manager" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "autonome.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
          env:
            - { name: AGENT_CONFIG,          value: /app/agent.yaml }
            - { name: SESSION_MANAGER_PORT,  value: "{{ $svc.port }}" }
            {{- with .Values.openai.baseUrl }}
            - { name: OPENAI_BASE_URL,       value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.timezone }}
            - { name: TZ,                    value: {{ . | quote }} }
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "autonome.secretName" . }}
                  key: OPENAI_API_KEY
          volumeMounts:
            - { name: config,   mountPath: /app/agent.yaml,      subPath: agent.yaml,     readOnly: true }
            - { name: config,   mountPath: /app/PERSONALITY.md,  subPath: PERSONALITY.md, readOnly: true }
            - { name: sessions, mountPath: /sessions }
            - { name: binaries, mountPath: /data/binaries }
          readinessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- include "autonome.resources" (dict "root" $ "svc" $svc) | nindent 12 }}
      volumes:
        - { name: config,   configMap: { name: {{ .Release.Name }}-agent-config } }
        - { name: sessions, persistentVolumeClaim: { claimName: {{ .Release.Name }}-sessions } }
        - { name: binaries, persistentVolumeClaim: { claimName: {{ .Release.Name }}-binaries } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: {{ $svc.port }}, targetPort: http }
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
