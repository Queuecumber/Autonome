{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  NIM_API_KEY: {{ required "secrets.values.nimApiKey is required when secrets.create=true" .Values.secrets.values.nimApiKey | quote }}
  MATRIX_PASSWORD: {{ required "secrets.values.matrixPassword is required when secrets.create=true" .Values.secrets.values.matrixPassword | quote }}
  {{- with .Values.secrets.values.searchApiKey }}
  SEARCH_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
