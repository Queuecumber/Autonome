{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ required "openai.apiKey required when secrets.create=true" .Values.openai.apiKey | quote }}
  MATRIX_PASSWORD: {{ required "matrix.password required when secrets.create=true" .Values.matrix.password | quote }}
  {{- with .Values.system.searchApiKey }}
  SEARCH_API_KEY: {{ . | quote }}
  {{- end }}
  {{- $embedding := .Values.services.graphitiMcp.embedding | default dict }}
  {{- with $embedding.apiKey | default (get .Values.mcp.secretEnv "EMBEDDING_API_KEY") }}
  EMBEDDING_API_KEY: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.mcp.secretEnv }}
  {{- if ne $key "EMBEDDING_API_KEY" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
