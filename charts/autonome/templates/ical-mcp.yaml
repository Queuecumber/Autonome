{{- $svc := .Values.services.icalMcp }}
{{- if $svc.enabled }}
{{- $name := "ical-mcp" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "autonome.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: mcp, containerPort: {{ $svc.port }} }
          env:
            - { name: ICAL_MCP_PORT, value: {{ $svc.port | quote }} }
            - name: ICAL_URLS
              valueFrom:
                secretKeyRef:
                  name: {{ required "services.icalMcp.urlsSecretRef.name is required" $svc.urlsSecretRef.name | quote }}
                  key: {{ required "services.icalMcp.urlsSecretRef.key is required" $svc.urlsSecretRef.key | quote }}
                  optional: false
            - { name: SESSION_MANAGER_URL, value: "http://session-manager:{{ .Values.services.sessionManager.port }}" }
            - { name: ICAL_TIMEZONE, value: {{ default (default "UTC" .Values.timezone) $svc.timezone | quote }} }
            - { name: ICAL_REFRESH_SECONDS, value: {{ $svc.refreshSeconds | quote }} }
            - { name: ICAL_TIMEOUT_SECONDS, value: {{ $svc.timeoutSeconds | quote }} }
            - { name: ICAL_MAX_FEED_BYTES, value: {{ $svc.maxFeedBytes | int | quote }} }
            - { name: ICAL_EVENT_ENERGY, value: {{ $svc.eventEnergy | quote }} }
            - { name: ICAL_SESSION_ID, value: {{ $svc.sessionId | quote }} }
            - { name: ICAL_STATE_PATH, value: /data/ical.sqlite3 }
          volumeMounts:
            - { name: state, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- include "autonome.resources" (dict "root" $ "svc" $svc) | nindent 12 }}
      volumes:
        - { name: state, persistentVolumeClaim: { claimName: {{ .Release.Name }}-ical } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: mcp, port: {{ $svc.port }}, targetPort: mcp }
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ical
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $svc.stateStorage.size }}
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
