{{- range $kind := list "imap" "smtp" }}
{{- $svc := index $.Values.services (printf "%sMcp" $kind) }}
{{- if $svc.enabled }}
{{- $name := printf "%s-mcp" $kind }}
{{- $prefix := upper $kind }}
{{- $server := required (printf "services.%sMcp.server is required" $kind) $svc.server }}
{{- $username := $svc.username | default "" }}
{{- $secret := dig "passwordSecretRef" "name" "" $svc }}
{{- if eq $kind "imap" }}
{{- $username = required "services.imapMcp.username is required" $username }}
{{- $secret = required "services.imapMcp.passwordSecretRef.name is required" $secret }}
{{- end }}
{{- if ne (empty $username) (empty $secret) }}
{{- fail (printf "services.%sMcp.username and passwordSecretRef.name must be set together or both empty (no-auth relay)" $kind) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" $.Release "Chart" $.Chart) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "autonome.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: mcp, containerPort: {{ $svc.port }} }
          env:
            - { name: {{ $prefix }}_MCP_PORT, value: {{ $svc.port | quote }} }
            - { name: {{ $prefix }}_SERVER, value: {{ $server | quote }} }
            - { name: {{ $prefix }}_USERNAME, value: {{ $username | quote }} }
            - { name: {{ $prefix }}_TIMEOUT_SECONDS, value: {{ $svc.timeoutSeconds | quote }} }
            {{- if $secret }}
            - name: {{ $prefix }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ required "passwordSecretRef.key is required" $svc.passwordSecretRef.key | quote }}
                  optional: false
            {{- end }}
            {{- if eq $kind "imap" }}
            - { name: SESSION_MANAGER_URL, value: "http://session-manager:{{ $.Values.services.sessionManager.port }}" }
            - { name: IMAP_FOLDERS, value: {{ $svc.folders | toJson | quote }} }
            - { name: IMAP_ID_PROVIDER, value: {{ $svc.idProvider | default "auto" | quote }} }
            - { name: IMAP_LOOKUP_MAX_MESSAGES, value: {{ $svc.lookupMaxMessages | default 200 | int | quote }} }
            - { name: IMAP_NOTIFY_SINCE, value: {{ $svc.notifySince | default "startup" | quote }} }
            - { name: IMAP_EVENT_ENERGY, value: {{ $svc.eventEnergy | quote }} }
            - { name: IMAP_SESSION_ID, value: {{ $svc.sessionId | quote }} }
            - { name: IMAP_POLL_SECONDS, value: {{ $svc.pollSeconds | quote }} }
            - { name: IMAP_MAX_MESSAGE_BYTES, value: {{ $svc.maxMessageBytes | int | quote }} }
            - { name: IMAP_STATE_PATH, value: /data/imap.sqlite3 }
            - { name: IMAP_INDEX_ENABLED, value: {{ $svc.index.enabled | quote }} }
            {{- if $svc.index.enabled }}
            - { name: IMAP_INDEX_DIR, value: /index }
            - { name: IMAP_INDEX_SYNC_SECONDS, value: {{ $svc.index.syncSeconds | quote }} }
            - { name: IMAP_INDEX_HEADER_BATCH, value: {{ $svc.index.headerBatch | int | quote }} }
            - { name: IMAP_INDEX_BODY_BATCH, value: {{ $svc.index.bodyBatch | int | quote }} }
            - { name: IMAP_INDEX_FLAG_BATCH, value: {{ $svc.index.flagBatch | int | quote }} }
            - { name: IMAP_INDEX_EMBEDDING_SECONDS, value: {{ $svc.index.embeddingSeconds | quote }} }
            - { name: IMAP_INDEX_JOURNAL_MODE, value: {{ $svc.index.journalMode | quote }} }
            {{- $embedding := $svc.index.embedding }}
            - { name: IMAP_EMBEDDING_MODEL, value: {{ $embedding.model | quote }} }
            {{- if $embedding.model }}
            - { name: IMAP_EMBEDDING_BASE_URL, value: {{ required "services.imapMcp.index.embedding.baseUrl is required when embedding is enabled" $embedding.baseUrl | quote }} }
            - { name: IMAP_EMBEDDING_PROVIDER, value: {{ $embedding.provider | quote }} }
            - { name: IMAP_EMBEDDING_DIM, value: {{ $embedding.dim | int | quote }} }
            - { name: IMAP_EMBEDDING_TIMEOUT_SECONDS, value: {{ $embedding.timeoutSeconds | quote }} }
            - { name: IMAP_EMBEDDING_MIN_SCORE, value: {{ $embedding.minScore | quote }} }
            - name: IMAP_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $embedding.apiKeySecretRef.name | default (include "autonome.secretName" $) | quote }}
                  key: {{ required "IMAP embedding apiKeySecretRef.key is required" $embedding.apiKeySecretRef.key | quote }}
                  optional: false
            {{- end }}
            {{- end }}
            {{- else }}
            - { name: SMTP_FROM, value: {{ required "services.smtpMcp.from is required" $svc.from | quote }} }
            - { name: SMTP_ALLOWED_RECIPIENTS, value: {{ $svc.allowedRecipients | toJson | quote }} }
            - { name: SMTP_ALLOW_ANY_RECIPIENT, value: {{ $svc.allowAnyRecipient | quote }} }
            - { name: SMTP_MAX_ATTACHMENT_BYTES, value: {{ $svc.maxAttachmentBytes | int | quote }} }
            {{- end }}
          {{- if eq $kind "imap" }}
          volumeMounts:
            - { name: state, mountPath: /data }
            {{- if $svc.index.enabled }}
            - { name: index, mountPath: /index }
            {{- end }}
          {{- end }}
          readinessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- include "autonome.resources" (dict "root" $ "svc" $svc) | nindent 12 }}
      {{- if eq $kind "imap" }}
      volumes:
        - { name: state, persistentVolumeClaim: { claimName: {{ $.Release.Name }}-imap } }
        {{- if $svc.index.enabled }}
        {{- if and $svc.index.storage.existingClaim (not $svc.index.storage.persistent) }}
        {{- fail "IMAP index existingClaim requires storage.persistent=true" }}
        {{- end }}
        - name: index
          {{- if $svc.index.storage.persistent }}
          persistentVolumeClaim:
            claimName: {{ $svc.index.storage.existingClaim | default (printf "%s-imap-index" $.Release.Name) | quote }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $svc.index.storage.size | quote }}
          {{- end }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" $.Release "Chart" $.Chart) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: mcp, port: {{ $svc.port }}, targetPort: mcp }
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
{{- if eq $kind "imap" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-imap
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $svc.stateStorage.size }}
  {{- with $.Values.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- if and $svc.index.enabled $svc.index.storage.persistent (not $svc.index.storage.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-imap-index
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $svc.index.storage.size }}
  storageClassName: {{ required "IMAP index persistence requires an explicit local/block storageClass or existingClaim" $svc.index.storage.storageClass | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
