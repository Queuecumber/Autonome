{{- $svc := .Values.services.graphitiMcp }}
{{- $graph := .Values.services.falkordb }}
{{- $name := "graphiti-mcp" }}
{{- $embedding := $svc.embedding | default dict }}
{{- $keyRef := $embedding.apiKeySecretRef | default dict }}
{{- if and $embedding.apiKey (or $keyRef.name (and $keyRef.key (ne $keyRef.key "EMBEDDING_API_KEY"))) }}
{{- fail "Choose embedding.apiKey or embedding.apiKeySecretRef, not both" }}
{{- end }}
{{- if and $embedding.apiKey (not .Values.secrets.create) }}
{{- fail "embedding.apiKey requires secrets.create=true; otherwise use apiKeySecretRef" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- if and .Values.secrets.create (not $keyRef.name) }}
      {{- $secret := include (print $.Template.BasePath "/secret.yaml") $ | fromYaml }}
      annotations:
        checksum/embedding-secret: {{ get $secret.stringData ($keyRef.key | default "EMBEDDING_API_KEY") | default "" | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "autonome.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: mcp, containerPort: {{ $svc.port }} }
          env:
            - { name: GRAPH_HOST, value: "falkordb" }
            - { name: GRAPH_PORT, value: "{{ $graph.port }}" }
            {{- with $embedding }}
            {{- if .model }}
            - { name: EMBEDDING_BASE_URL, value: {{ required "services.graphitiMcp.embedding.baseUrl is required when model is set" .baseUrl | quote }} }
            {{- else }}
            - { name: EMBEDDING_BASE_URL, value: {{ .baseUrl | default "" | quote }} }
            {{- end }}
            - { name: EMBEDDING_MODEL,    value: {{ .model | quote }} }
            - { name: EMBEDDING_DIM,      value: {{ .dim | quote }} }
            - { name: EMBEDDING_PROVIDER, value: {{ .provider | quote }} }
            - { name: EMBEDDING_TIMEOUT_SECONDS, value: {{ .timeoutSeconds | quote }} }
            - { name: EMBEDDING_MIN_SCORE, value: {{ .minScore | quote }} }
            {{- end }}
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $keyRef.name | default (include "autonome.secretName" .) }}
                  key: {{ $keyRef.key | default "EMBEDDING_API_KEY" }}
                  optional: {{ empty $keyRef.name }}
          readinessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: {{ $svc.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- include "autonome.resources" (dict "root" $ "svc" $svc) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "autonome.labels" (dict "name" $name "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: mcp, port: {{ $svc.port }}, targetPort: mcp }
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# The graph store. Kept as its own deployment rather than embedded in the MCP
# server: an embedded backend was the original plan, but the one that fit
# (Kuzu) was archived by its authors in late 2025.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-falkordb
  labels:
    {{- include "autonome.labels" (dict "name" "falkordb" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: falkordb
          image: {{ $graph.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: redis, containerPort: {{ $graph.port }} }
          volumeMounts:
            - { name: graph, mountPath: /var/lib/falkordb/data }
          readinessProbe:
            tcpSocket: { port: {{ $graph.port }} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: {{ $graph.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- include "autonome.resources" (dict "root" $ "svc" $graph) | nindent 12 }}
      volumes:
        - { name: graph, persistentVolumeClaim: { claimName: {{ .Release.Name }}-graph } }
---
apiVersion: v1
kind: Service
metadata:
  name: falkordb
  labels:
    {{- include "autonome.labels" (dict "name" "falkordb" "Release" .Release "Chart" .Chart) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: redis, port: {{ $graph.port }}, targetPort: redis }
  selector:
    app.kubernetes.io/name: falkordb
    app.kubernetes.io/instance: {{ .Release.Name }}
