image:
  registry: ghcr.io/queuecumber
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

storage:
  storageClass: ""
  sessions:     { size: 5Gi }
  binaries:     { size: 10Gi }
  workspace:    { size: 10Gi }
  memory:       { size: 1Gi }
  matrixCrypto: { size: 100Mi }
  time:         { size: 100Mi }
  graph:        { size: 5Gi }

# agent.yaml and PERSONALITY.md contents — typically supplied via
# `helm install --set-file agent.config=agent.yaml --set-file agent.personality=PERSONALITY.md`
agent:
  config: ""
  personality: ""

# If create: true, chart writes <release>-secrets from the values below.
# If false, references existingName (or <release>-secrets if blank).
secrets:
  create: true
  existingName: ""

openai:
  baseUrl: ""
  apiKey: ""

matrix:
  homeserver: ""
  userId: ""
  password: ""

system:
  searchUrl: ""
  searchApiKey: ""

# Secrets for MCP servers that need auth (Home Assistant and friends).
# Each key is exposed to session-manager as an environment variable, for
# ${VAR} interpolation in the `mcp_servers` headers of agent.yaml:
#
#   mcp:
#     secretEnv:
#       HA_TOKEN: "eyJhbGci..."
#
#   # agent.yaml
#   mcp_servers:
#     home_assistant:
#       url: http://homeassistant.local:8123/mcp
#       headers:
#         Authorization: "Bearer ${HA_TOKEN}"
#
# Values are only used when secrets.create=true; with secrets.existingName
# set, provide the same keys in that secret and leave the values empty.
mcp:
  secretEnv: {}

# Empty values fall back to time-mcp's own defaults.
time:
  continuityCron: ""
  continuityMessage: ""

# Empty skips the TZ env var entirely.
timezone: America/New_York

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits:   { memory: 1Gi }

services:
  sessionManager: { image: { name: autonome-session-manager }, port: 5000 }
  matrixAdapter:  { image: { name: autonome-matrix-adapter },  port: 8200 }
  workspaceFsMcp: { image: { name: autonome-workspace-fs-mcp }, port: 8000 }
  memoryMcp:      { image: { name: autonome-memory-mcp },      port: 8001 }
  systemMcp:      { image: { name: autonome-system-mcp },      port: 8002 }
  timeMcp:        { image: { name: autonome-time-mcp },        port: 8300 }
  imapMcp:
    enabled: false
    image: { name: autonome-imap-mcp }
    port: 8006
    # For a trusted in-cluster relay (e.g. Proton Mail Bridge) use a plaintext
    # imap:// URL; bridge logins still require username and passwordSecretRef.
    server: ""
    username: ""
    passwordSecretRef: { name: "", key: IMAP_PASSWORD }
    folders: [INBOX]
    eventEnergy: passive
    sessionId: ""
    pollSeconds: 60
    timeoutSeconds: 20
    maxMessageBytes: 26214400
    stateStorage: { size: 100Mi }
  smtpMcp:
    enabled: false
    image: { name: autonome-smtp-mcp }
    port: 8007
    # For a trusted in-cluster relay use a plaintext smtp:// URL and leave
    # username and passwordSecretRef.name empty (both empty together).
    server: ""
    username: ""
    passwordSecretRef: { name: "", key: SMTP_PASSWORD }
    from: ""
    allowedRecipients: []
    allowAnyRecipient: false
    timeoutSeconds: 20
    maxAttachmentBytes: 26214400
  icalMcp:
    enabled: false
    image: { name: autonome-ical-mcp }
    port: 8008
    urlsSecretRef: { name: "", key: ICAL_URLS }
    timezone: ""
    refreshSeconds: 300
    timeoutSeconds: 20
    maxFeedBytes: 5242880
    eventEnergy: passive
    sessionId: ""
    stateStorage: { size: 100Mi }
  graphitiMcp:
    image: { name: autonome-graphiti-mcp }
    port: 8005
    embedding:
      model: ""
      baseUrl: ""
      provider: nvidia
      dim: 0
      timeoutSeconds: 20
      minScore: 0.6
      apiKey: ""
      apiKeySecretRef:
        name: ""
        key: EMBEDDING_API_KEY
  # The graph store behind graphiti-mcp. Embeddings are optional: unset, the
  # service still records and traverses facts, and keyword search still works —
  # only semantic search is disabled.
  falkordb:       { image: falkordb/falkordb:latest,           port: 6379 }
