[project]
name = "autonome-system-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3,<4",
    "mcp>=1.26,<2",
    "httpx>=0.27",
    "html2text>=2024.2",
    "curl_cffi>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_mcp"]
