[project]
name = "autonome-imap-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastmcp>=2.0", "imapclient>=3.1,<4", "httpx>=0.27", "markdownify>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imap_mcp"]
