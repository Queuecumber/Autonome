[project]
name = "autonome-graphiti-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0,<4",
    "graphiti-core[falkordb]>=0.30,<0.31",
    "openai>=1.91.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphiti_mcp"]
