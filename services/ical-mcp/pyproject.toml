[project]
name = "autonome-ical-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastmcp>=2.0", "httpx>=0.27", "icalendar>=6,<7", "recurring-ical-events>=3.8,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ical_mcp"]
